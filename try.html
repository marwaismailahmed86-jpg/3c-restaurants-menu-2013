<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image:url("images/OIP.webp") ;
            background-repeat: no-repeat;
            background-color: center;
            background-size: cover;
            background-attachment: fixed;
            background: linear-gradient(to top left , cyan, darkred);
            background-color: blue;
        }
        h1{
          background-color: rgb(56, 161, 161);  
        }
        .base1{
            opacity: 1;
        }
        .base2{
            opacity: 0.5;
        }
        .base3{
            opacity: 0.3;
        }
        .base4{
            opacity: 0;
        }
    
    </style>
</head>
<body>
    <h1 class="base1">Html</h1>
    <h1 class="base2">CSS</h1>
    <h1 class="base3">JavaScript</h1>
    <h1 class="base4">python</h1>
</body>
</html>
